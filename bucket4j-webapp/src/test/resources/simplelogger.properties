# Jetty logs at INFO on every server start/stop, which is noise in test output — only warnings and errors.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false

# Netty (via Lettuce) warns on macOS that io.netty:netty-resolver-dns-native-macos is absent, so it will
# fall back to system DNS defaults. Irrelevant here: locally the cluster is reached at the literal IP
# 127.0.0.1, so nothing is resolved, and CI sets VALKEY_HOST=valkey but runs on Linux, where this
# macOS-only provider does not apply. Adding the native library would mean an OS- and arch-specific
# dependency for no behavioural gain.
org.slf4j.simpleLogger.log.io.netty.resolver.dns.DnsServerAddressStreamProviders=error
